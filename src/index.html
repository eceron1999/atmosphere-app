<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" href="./images/weather-svgrepo-com (1).svg">
    <title>AtmoSphere | Weather Forecast</title>
</head>
<body>
    <header class="sticky top-0 z-50 flex justify-between items-center w-full h-16 px-4 gap-2 bg-brand-bg/80 backdrop-blur-md border-b border-b-hairline/60 sm:h-20 sm:px-6 sm:gap-4">
        <a href="#" class="flex items-center gap-2 group active:opacity-80 transition-opacity">
            <div class="hidden sm:flex justify-center items-center shrink-0 w-12 h-12 bg-brand-surface/80 border border-hairline/60 rounded-xl ring-1 ring-white/10 ring-inset shadow-sm shadow-accent-sky-glow/15 md:w-14 md:h-14 group-hover:border-hairline-hover group-hover:shadow-accent-sky-glow/30 transition-all duration-300">
                <img src="./images/weather-svgrepo-com (1).svg" alt="AtmoSphere Logo" class="w-9 h-9 mt-2 object-contain md:w-10 md:h-10">
            </div>

            <h1 class="font-medium text-2xl tracking-tight sm:text-3xl md:text-4xl">
                Atmo<span class="font-black text-transparent bg-linear-to-r from-accent-sky to-accent-cyan bg-clip-text group-hover:brightness-110 transition-all duration-300">Sphere</span>
            </h1>
        </a>

        <div class="flex items-center gap-2 w-auto md:gap-3">
            <!-- Search Form -->
            <form class="flex-1 relative w-full max-w-44 sm:max-w-xs">
                <label for="search-input" class="sr-only">Search for a city</label>
                <input type="text" id="search-input" placeholder="Search.." autocomplete="off" spellcheck="false" class="w-full h-10 pl-9 pr-9 text-xs text-text-main placeholder:text-text-muted bg-brand-input/60 border border-hairline/60 rounded-xl sm:h-11 sm:pl-10 sm:pr-10 sm:text-sm hover:border-hairline-hover focus:outline-none focus:border-accent-sky focus:ring-2 focus:ring-accent-sky/20 focus:transition-all duration-300">

                <!-- Search Icon -->
                <i class="fa-solid fa-magnifying-glass absolute z-10 left-3 top-1/2 -translate-y-1/2 text-xs text-text-muted pointer-events-none sm:left-3.5 sm:text-sm"></i>

                <!-- Search Button -->
                <button id="search-btn" type="submit" aria-label="Submit search" class="absolute right-1.5 top-1/2 -translate-y-1/2 flex justify-center items-center w-7 h-7 text-text-muted rounded-lg cursor-pointer sm:right-2 hover:bg-brand-surface/60 hover:text-accent-sky active:scale-95 active:text-accent-sky transition-all duration-200">
                    <i class="fa-solid fa-arrow-right text-xs sm:text-sm"></i>
                </button>
            </form>

            <!-- Current Location Button -->
            <button id="cur-loc-btn" type="button" title="Use current location" aria-label="Use current location" class="flex justify-center items-center shrink-0 w-10 h-10 text-text-muted bg-brand-surface border border-hairline/60 rounded-xl shadow-sm shadow-accent-sky/10 ring-1 ring-white/10 ring-inset cursor-pointer group sm:w-11 sm:h-11 hover:bg-brand-surface/90 hover:text-accent-sky hover:border-accent-sky-glow/50 hover:shadow-md hover:shadow-accent-sky-glow/20 active:scale-95 active:text-accent-sky active:border-accent-sky transition-all duration-300">
                <i class="fa-solid fa-location-crosshairs text-sm sm:text-base group-hover:scale-110 transition-transform duration-300"></i>
            </button>
        </div>
    </header>

    <main class="flex flex-col gap-8 p-4 max-w-7xl w-full mx-auto">
        <!-- Weather Hero -->
        <section aria-labelledby="current-location" class="flex flex-col gap-6 p-5 bg-brand-surface border border-hairline rounded-xl shadow-xl sm:p-6">
            <div class="flex justify-between items-start">
                <!-- Current Location -->
                <div class="flex flex-col gap-1">
                    <h2 id="current-location" class="text-2xl font-bold text-text-main sm:text-3xl hover:text-accent-sky cursor-pointer transition-colors">Raleigh, NC, US</h2>
                    <p id="time-stamp" class="text-sm text-text-muted">As of 7:30 PM EDT &middot; Live</p>
                </div>
    
                <!-- Temperature Toggle Button -->
                 <div role="group" aria-label="Temperature unit selection" class="flex items-center gap-0.5 p-1 bg-brand-bg border border-hairline rounded-full transition-all duration-200">
                    <button id="c-toggle-btn" type="button" aria-pressed="false" class="flex justify-center items-center px-3 py-1 text-text-muted bg-transparent rounded-full cursor-pointer hover:text-text-main hover:bg-brand-surface/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-sky active:scale-95 transition-all duration-200">&deg;C</button>
    
                    <button id="f-toggle-btn" type="button" aria-pressed="true" aria-label="Fahrenheit, selected" class="flex justify-center items-center px-3 py-1 text-text-main font-semibold bg-brand-surface rounded-full cursor-pointer hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-sky active:scale-95 transition-all duration-200">&deg;F</button>
                 </div>
            </div>

            <div class="flex flex-col gap-2 py-3 md:flex-row md:items-center md:justify-center md:gap-12">
                <!-- Current Temperature -->
                <div class="flex justify-center items-center gap-3 md:gap-0">
                    <span id="current-temp" class="text-7xl font-extrabold text-text-main sm:text-8xl">62&deg;</span>
                    <!-- Mobile Icon -->
                     <div class="md:hidden">
                         <i aria-hidden="true" class="fa-solid fa-sun text-6xl text-accent-sky sm:text-7xl"></i>
                     </div>
                </div>

                <div class="flex flex-col justify-center items-center gap-0.5">
                    <!-- Desktop Icon -->
                    <div class="hidden mb-3 md:block">
                        <i aria-hidden="true" class="fa-solid fa-sun text-5xl text-accent-sky"></i>
                    </div>

                    <!-- Weather Condition -->
                    <p id="weather-condition" class="font-medium text-center text-text-main">Sunny <span class="text-text-muted">&bull; Feels like 62&deg;</span></p>
                    <p id="highs-lows" class="text-sm text-center text-text-muted">High: <span class="font-semibold text-text-main">65&deg;</span> &bull; Low: <span class="font-semibold text-text-main">53&deg;</span></p>
                </div>
            </div>

            <!-- Divider -->
            <div class="border-t border-hairline pt-4 md:pt-6">
                <!-- Weather Details Grid -->
                <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
                    <!-- Wind Stat -->
                    <div class="flex flex-col items-start gap-1 p-3 bg-brand-bg border border-hairline/50 rounded-lg md:p-4 hover:border-hairline hover:bg-brand-bg/80 hover:shadow-md hover:-translate-y-0.5 group transition-all duration-200 ease-in-out">
                        <p class="flex items-center gap-1.5 font-medium text-[11px] uppercase tracking-wider text-text-muted"><i aria-hidden="true" class="fa-solid fa-wind text-accent-sky group-hover:scale-110 transition-transform duration-200"></i> Wind</p>
                        <p id="wind" class="font-bold text-text-main md:text-lg">12 <span class="text-xs text-text-muted md:text-sm">mph NNE</span></p>
                    </div>

                    <!-- Humidity Stat -->
                    <div class="flex flex-col items-start gap-1 p-3 bg-brand-bg border border-hairline/50 rounded-lg md:p-4 hover:border-hairline hover:bg-brand-bg/80 hover:shadow-md hover:-translate-y-0.5 group transition-all duration-200 ease-in-out">
                        <p class="flex items-center gap-1.5 font-medium text-[11px] uppercase tracking-wider text-text-muted"><i aria-hidden="true" class="fa-solid fa-droplet text-accent-sky group-hover:scale-110 transition-transform duration-200"></i> Humidity</p>
                        <p id="humidity" class="font-bold text-text-main md:text-lg">68%</p>
                    </div>

                    <!-- UV-Index Stat -->
                    <div class="flex flex-col items-start gap-1 p-3 bg-brand-bg border border-hairline/50 rounded-lg md:p-4 hover:border-hairline hover:bg-brand-bg/80 hover:shadow-md hover:-translate-y-0.5 group transition-all duration-200 ease-in-out">
                        <p class="flex items-center gap-1.5 font-medium text-[11px] uppercase tracking-wider text-text-muted"><i aria-hidden="true" class="fa-solid fa-sun text-accent-sky group-hover:scale-110 transition-transform duration-200"></i> UV Index</p>
                        <div class="flex items-center gap-2">
                            <p id="uv-index" class="font-bold text-text-main md:text-lg">0</p>
                            <span class="px-2 py-0.5 text-[10px] font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-full hover:bg-emerald-500/20 hover:border-emerald-500/40 transition-colors duration-200">Low</span>
                        </div>
                    </div>

                    <!-- Precipitation Stat -->
                    <div class="flex flex-col items-start gap-1 p-3 bg-brand-bg border border-hairline/50 rounded-lg md:p-4 hover:border-hairline hover:bg-brand-bg/80 hover:shadow-md hover:-translate-y-0.5 group transition-all duration-200 ease-in-out">
                        <p class="flex items-center gap-1.5 font-medium text-[11px] uppercase tracking-wider text-text-muted"><i aria-hidden="true" class="fa-solid fa-cloud-rain text-accent-sky group-hover:scale-110 transition-transform duration-200"></i> Precipitation</p>
                        <p id="precipitation" class="font-bold text-text-main md:text-lg">15%</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 5 Day Forecast -->
        <section aria-labelledby="forecast-heading" class="flex flex-col gap-5 p-5 bg-brand-surface border border-hairline rounded-xl shadow-xl sm:p-6">
            <h2 id="forecast-heading" class="flex items-center gap-2.5 font-bold text-lg text-text-main sm:text-xl">
                <i aria-hidden="true" class="fa-solid fa-calendar-days text-accent-sky"></i>
                <span>5-Day Forecast</span>
            </h2>

            <ul class="flex flex-col gap-3">
                <li class="flex items-center justify-between gap-3 p-3 bg-brand-bg/50 border border-hairline/50 rounded-lg">
                    <!-- Day -->
                    <p class="w-16 shrink-0 font-bold text-text-main">Today</p>

                    <!-- Condition -->
                    <p class="flex items-center gap-2 min-w-0">
                        <i aria-hidden="true" class="fa-solid fa-sun text-amber-400"></i>
                        <span class="hidden font-medium text-sm text-text-main truncate sm:inline-block">Sunny</span>
                    </p>

                    <!-- Precipitation % -->
                    <p class="flex items-center gap-1 text-xs text-text-muted">
                        <i aria-hidden="true" class="fa-solid fa-droplet text-accent-sky"></i>
                        <span class="text-sm">10%</span>
                    </p>

                    <!-- High/Low Temp Range -->
                     <div class="flex items-center gap-2.5">
                        <span class="font-medium text-sm text-text-muted">53&deg;</span>

                        <!-- Outer Track Range -->
                        <div aria-hidden="true" class="relative w-20 h-2 bg-white/10 border border-white/20 rounded-full sm:w-28">
                            <!-- Todays Range -->
                            <div class="absolute inset-y-0 left-[25%] right-[20%] bg-linear-to-r from-teal-400 via-emerald-400 to-yellow-400 rounded-full"></div>
                            <!-- Current Temp Dot -->
                            <div class="absolute top-1/2 -translate-y-1/2 left-[62.5%] -translate-x-1/2 w-2.5 h-2.5 bg-text-main rounded-full ring-2 ring-brand-surface"></div>
                        </div>

                        <span class="font-semibold text-sm text-text-main">65&deg;</span>
                     </div>
                </li>
            </ul>
        </section> 
    </main>
    <script src="./app.js"></script>
</body>
</html>
